# ─────────────────────────────────────────────
# kitty.conf
# Move to: ~/.config/kitty/kitty.conf
# Reload with ctrl+shift+f5
# ─────────────────────────────────────────────

# ──────── Theme ─────────
#  current: Afterglow
https://github.com/dexpota/kitty-themes
include ./kitty-themes/themes/Afterglow.conf

# ───────── Font ─────────
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Slightly taller lines for readability
modify_font cell_height 110%
# Break ligatures (=> != etc.) only under the cursor
disable_ligatures cursor

# ───────── Cursor ─────────
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
# Trail effect when the cursor jumps (0 = off)
cursor_trail 3
cursor_trail_decay 0.1 0.4

# ───────── Scrollback ─────────
# Default is 2000, too small for big logs
scrollback_lines 10000
# Extra history (in MB) for the pager (ctrl+shift+h)
scrollback_pager_history_size 50

# ───────── Mouse / Clipboard ─────────
# Copy to clipboard on select
copy_on_select clipboard
# Strip trailing spaces when copying
strip_trailing_spaces smart
mouse_hide_wait 3.0
detect_urls yes
url_style curly

# ───────── Performance (GPU) ─────────
# Lower latency (defaults: 10 and 3)
repaint_delay 8
input_delay 2
# Prevent tearing
sync_to_monitor yes

# ───────── Bell ─────────
enable_audio_bell no
window_alert_on_bell yes

# ───────── Window ─────────
remember_window_size yes
window_padding_width 8
# 0 = close without asking; -1 = ask only if a process is running
confirm_os_window_close -1
# Titlebar matches the terminal background on Wayland
wayland_titlebar_color background
# "splits" layout is needed for ctrl+h split; "stack" lets you zoom a split (ctrl+shift+l to cycle)
enabled_layouts splits,stack

# ───────── Transparency (optional, costs a bit of GPU) ─────────
background_opacity 0.92
# Blur works on KDE Wayland
background_blur 20
# Allow changing opacity at runtime (ctrl+shift+a then m / l)
dynamic_background_opacity yes

# ───────── Tab bar ─────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# ───────── Extras ─────────
# Notify when a long command (>15s) finishes while the window is hidden
notify_on_cmd_finish invisible 15
# Shell integration: jump between prompts, show last command output, etc.
shell_integration enabled

# ───────── Keyboard shortcuts (browser-like) ─────────
# New tab (opens in the current directory)
map ctrl+t new_tab_with_cwd
# Close tab
map ctrl+w close_tab
# Next tab to the right (wraps around)
map ctrl+tab next_tab
# Previous tab to the left (wraps around)
map ctrl+shift+tab previous_tab
# Split the window in half, side by side (use --location=hsplit for top/bottom)
map ctrl+h launch --location=vsplit --cwd=current
